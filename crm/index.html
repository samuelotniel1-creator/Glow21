<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glow21 — CRM</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,400;1,500&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --pearl: #FDFBF7;
    --slate: #2C3539;
    --slate-deep: #21282b;
    --slate-panel: #262d30;
    --champagne: #E5C4A3;
    --quartz: #F4DCD6;
    --pearl-70: rgba(253, 251, 247, 0.7);
    --pearl-50: rgba(253, 251, 247, 0.5);
    --gradient-bruma: linear-gradient(135deg, #F4DCD6 0%, #E5C4A3 100%);
    --serif: 'Playfair Display', Cambria, Georgia, serif;
    --sans: 'Montserrat', Calibri, 'Segoe UI', sans-serif;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
  }

  html, body {
    font-family: var(--sans);
    background: var(--slate);
    color: var(--pearl);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  body {
    background:
      radial-gradient(ellipse 700px 500px at 12% -10%, rgba(229,196,163,0.08), transparent 60%),
      radial-gradient(ellipse 600px 500px at 100% 110%, rgba(244,220,214,0.06), transparent 60%),
      var(--slate);
    padding: 40px 24px 80px;
  }

  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--champagne); outline-offset: 2px; }
  button { font-family: var(--sans); }
  [hidden] { display: none !important; }

  /* ---------- Login (mismo patrón que /admin) ---------- */
  .login-wrap { min-height: calc(100vh - 120px); display: flex; align-items: center; justify-content: center; }
  .login-panel { width: 100%; max-width: 440px; }
  .login-card {
    background: var(--slate-deep);
    border: 1px solid rgba(229, 196, 163, 0.28);
    border-radius: 10px;
    padding: 48px;
  }
  .login-card h1 {
    font-family: var(--serif); font-style: italic; font-weight: 500;
    font-size: 28px; color: var(--pearl); margin-bottom: 6px;
  }
  .login-card p.intro { color: var(--pearl-50); font-size: 13.5px; margin-bottom: 28px; }
  .field { margin-bottom: 22px; }
  .field:last-of-type { margin-bottom: 0; }
  label {
    display: block; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--champagne); margin-bottom: 10px;
  }
  input[type="text"], input[type="email"], input[type="password"], input[type="search"] {
    width: 100%; padding: 12px 14px;
    border: 1px solid rgba(253, 251, 247, 0.18);
    border-radius: 6px;
    background: rgba(253, 251, 247, 0.04);
    color: var(--pearl);
    font-size: 14px; font-family: var(--sans);
    transition: border-color 0.3s ease, background 0.3s ease;
  }
  input:focus { outline: none; border-color: var(--champagne); background: rgba(253, 251, 247, 0.07); }
  input::placeholder { color: rgba(253, 251, 247, 0.32); }

  .login-error {
    font-size: 13px; color: var(--quartz); background: rgba(244, 220, 214, 0.1);
    border: 1px solid rgba(244,220,214,0.3); border-radius: 6px;
    padding: 12px 14px; margin-top: 22px;
  }

  .btn {
    padding: 13px 22px; border: none; border-radius: 6px;
    font-size: 12.5px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase;
    cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    transition: transform 0.3s var(--ease), box-shadow 0.3s var(--ease), background 0.3s ease, border-color 0.3s ease, color 0.3s ease;
  }
  .btn .icon { width: 15px; height: 15px; flex-shrink: 0; }
  .btn-save { background: var(--gradient-bruma); color: var(--slate); width: 100%; margin-top: 28px; }
  .btn-save:hover { transform: translateY(-1px); box-shadow: 0 14px 30px -12px rgba(0,0,0,0.55); }
  .btn-outline { background: transparent; color: var(--pearl-70); border: 1px solid rgba(253, 251, 247, 0.18); }
  .btn-outline:hover { border-color: var(--champagne); color: var(--pearl); }
  .btn-link {
    background: transparent; color: var(--pearl-50); border: none;
    text-transform: none; letter-spacing: normal; font-weight: 500;
    text-decoration: underline; padding: 4px;
  }
  .btn-link:hover { color: var(--pearl); }

  /* ---------- App shell ---------- */
  .app { max-width: 1180px; margin: 0 auto; }
  .app-header {
    display: flex; align-items: center; justify-content: space-between; gap: 20px;
    flex-wrap: wrap; margin-bottom: 36px;
  }
  .app-brand { display: flex; align-items: center; gap: 12px; }
  .app-brand img { height: 30px; width: auto; }
  .app-brand span { font-family: var(--serif); font-style: italic; font-size: 15px; color: var(--pearl-70); }
  .app-header-actions { display: flex; gap: 10px; flex-wrap: wrap; }

  .tabs { display: flex; gap: 8px; margin-bottom: 22px; }
  .tab {
    background: transparent; border: 1px solid rgba(253,251,247,0.14); color: var(--pearl-70);
    padding: 12px 22px; border-radius: 999px; font-size: 13px; font-weight: 600;
    cursor: pointer; transition: all 0.3s var(--ease);
  }
  .tab .count {
    display: inline-block; margin-left: 8px; padding: 1px 8px; border-radius: 999px;
    background: rgba(253,251,247,0.1); font-size: 11.5px;
  }
  .tab.active { background: var(--gradient-bruma); color: var(--slate); border-color: transparent; }
  .tab.active .count { background: rgba(44,53,57,0.18); }

  .toolbar {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    flex-wrap: wrap; margin-bottom: 20px;
  }
  .search-wrap { position: relative; flex: 1; min-width: 220px; max-width: 380px; }
  .search-wrap .icon {
    position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
    width: 15px; height: 15px; color: var(--pearl-50); pointer-events: none;
  }
  .search-wrap input { padding-left: 38px; }

  .panel-table {
    background: var(--slate-deep);
    border: 1px solid rgba(229, 196, 163, 0.28);
    border-radius: 10px;
    overflow: hidden;
  }
  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 760px; }
  thead th {
    text-align: left; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--champagne); padding: 16px 18px; border-bottom: 1px solid rgba(253,251,247,0.12);
    white-space: nowrap;
  }
  tbody td {
    padding: 14px 18px; font-size: 13.5px; color: var(--pearl);
    border-bottom: 1px solid rgba(253,251,247,0.06); vertical-align: middle;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: rgba(253,251,247,0.02); }
  .cell-muted { color: var(--pearl-50); font-size: 12.5px; }
  .cell-nota input {
    padding: 8px 10px; font-size: 12.5px; min-width: 160px;
  }

  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
    padding: 5px 11px; border-radius: 999px;
  }
  .badge-paid { background: rgba(229,196,163,0.18); color: var(--champagne); }
  .badge-pending { background: rgba(253,251,247,0.08); color: var(--pearl-50); }

  .pago-meta { display: flex; align-items: center; gap: 8px; }

  .pago-dot { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--pearl-50); }
  .pago-dot::before {
    content: ''; width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0;
    background: rgba(253,251,247,0.15);
  }
  .pago-dot.is-paid { color: #4ade80; font-weight: 600; }
  .pago-dot.is-paid::before { background: #4ade80; box-shadow: 0 0 6px rgba(74,222,128,0.7); }

  .id-copy {
    font-family: 'SFMono-Regular', Consolas, monospace; font-size: 11.5px;
    background: none; border: none; color: var(--pearl-50); cursor: pointer;
    padding: 2px 0; text-align: left; transition: color 0.2s ease;
  }
  .id-copy:hover { color: var(--champagne); text-decoration: underline; }

  .toggle-mini {
    width: 38px; height: 22px; border-radius: 999px; cursor: pointer; position: relative;
    background: rgba(253, 251, 247, 0.12); border: 1px solid rgba(253, 251, 247, 0.2);
    flex-shrink: 0; transition: background 0.3s var(--ease), border-color 0.3s var(--ease);
    display: inline-block;
  }
  .toggle-mini.active { background: var(--gradient-bruma); border-color: transparent; }
  .toggle-mini-thumb {
    position: absolute; top: 2px; left: 2px; width: 16px; height: 16px;
    background: var(--pearl); border-radius: 50%; transition: left 0.3s var(--ease);
  }
  .toggle-mini.active .toggle-mini-thumb { left: 18px; }

  .empty-state {
    text-align: center; padding: 70px 20px; color: var(--pearl-50);
  }
  .empty-state strong { display: block; font-family: var(--serif); font-style: italic; font-size: 18px; color: var(--pearl); margin-bottom: 8px; font-weight: 500; }

  /* ---------- Lead list (preview rows) ---------- */
  .lead-list { display: flex; flex-direction: column; }
  .lead-row {
    display: flex; align-items: center; gap: 16px; width: 100%;
    padding: 14px 20px; border: none; border-bottom: 1px solid rgba(253,251,247,0.06);
    background: none; color: inherit; text-align: left; cursor: pointer;
    font-family: var(--sans); transition: background 0.2s ease;
  }
  .lead-list > .lead-row:last-child { border-bottom: none; }
  .lead-row:hover, .lead-row:focus-visible { background: rgba(253,251,247,0.03); }

  .lead-avatar {
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    width: 38px; height: 38px; border-radius: 50%;
    background: var(--gradient-bruma); color: var(--slate);
    font-family: var(--serif); font-style: italic; font-weight: 500; font-size: 16px;
  }
  .lead-avatar-lg { width: 52px; height: 52px; font-size: 21px; }

  .lead-row-main { display: flex; align-items: center; gap: 14px; min-width: 0; flex: 1; }
  .lead-row-text { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .lead-row-text .lead-name { font-size: 14px; font-weight: 600; color: var(--pearl); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lead-row-text .lead-email { font-size: 12.5px; color: var(--pearl-50); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .lead-row-meta { display: flex; align-items: center; gap: 18px; flex-shrink: 0; }
  .lead-row-meta .cell-muted { min-width: 76px; text-align: right; }

  .contactado-dot { display: inline-flex; width: 8px; height: 8px; border-radius: 50%; background: rgba(253,251,247,0.15); flex-shrink: 0; }
  .contactado-dot.is-on { background: var(--champagne); box-shadow: 0 0 6px rgba(229,196,163,0.6); }

  .lead-row-chevron { width: 16px; height: 16px; color: var(--pearl-50); flex-shrink: 0; }

  /* ---------- Lead detail modal ---------- */
  textarea {
    border: 1px solid rgba(253, 251, 247, 0.18); border-radius: 6px;
    background: rgba(253, 251, 247, 0.04); color: var(--pearl); font-family: var(--sans);
    transition: border-color 0.3s ease, background 0.3s ease;
  }
  textarea:focus { outline: none; border-color: var(--champagne); background: rgba(253, 251, 247, 0.07); }
  textarea::placeholder { color: rgba(253, 251, 247, 0.32); }

  .lead-modal { position: fixed; inset: 0; z-index: 100; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .lead-modal-backdrop { position: absolute; inset: 0; background: rgba(15,18,20,0.7); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
  .lead-modal-card {
    position: relative; width: 100%; max-width: 480px; max-height: min(88vh, 720px); overflow-y: auto;
    background: var(--slate-deep); border: 1px solid rgba(229,196,163,0.28); border-radius: 12px;
    padding: 32px; box-shadow: 0 40px 80px -20px rgba(0,0,0,0.6);
  }
  .lead-modal-close {
    position: absolute; top: 18px; right: 18px;
    width: 32px; height: 32px; border-radius: 50%; border: none;
    background: rgba(253,251,247,0.06); color: var(--pearl-70); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .lead-modal-close:hover { background: rgba(253,251,247,0.12); color: var(--pearl); }
  .lead-modal-close svg { width: 16px; height: 16px; }

  .lead-modal-head { display: flex; align-items: center; gap: 16px; margin-bottom: 26px; padding-right: 30px; }
  .lead-modal-head h2 { font-family: var(--serif); font-style: italic; font-weight: 500; font-size: 21px; color: var(--pearl); margin-bottom: 4px; }

  .lead-modal-fields { display: flex; flex-direction: column; gap: 16px; margin-bottom: 26px; }
  .lead-field { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .lead-field-label { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--champagne); padding-top: 6px; flex-shrink: 0; }
  .lead-field-value { font-size: 14px; color: var(--pearl); text-align: right; word-break: break-word; padding-top: 4px; min-width: 0; }
  .lead-field-value.is-mono { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 12px; color: var(--pearl-70); }
  .lead-field-right { display: flex; align-items: flex-start; gap: 8px; min-width: 0; }

  .icon-btn {
    display: flex; align-items: center; justify-content: center;
    width: 30px; height: 30px; border-radius: 8px; border: 1px solid rgba(253,251,247,0.14);
    background: rgba(253,251,247,0.03); color: var(--pearl-70); cursor: pointer;
    transition: border-color 0.2s ease, color 0.2s ease, background 0.2s ease;
    text-decoration: none; flex-shrink: 0;
  }
  .icon-btn svg { width: 15px; height: 15px; }
  .icon-btn:hover { border-color: var(--champagne); color: var(--champagne); }
  .icon-btn.whatsapp:hover { border-color: #4ade80; color: #4ade80; }

  .lead-modal-footer { display: flex; flex-direction: column; gap: 18px; padding-top: 22px; border-top: 1px solid rgba(253,251,247,0.1); }
  .lead-modal-row { display: flex; align-items: center; justify-content: space-between; gap: 14px; }
  .lead-modal-row label { margin-bottom: 0; }
  .lead-modal-row-nota { flex-direction: column; align-items: stretch; gap: 8px; }
  #leadModalNota { width: 100%; padding: 10px 12px; font-size: 13px; }

  .app-status {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--slate-deep); border: 1px solid rgba(229,196,163,0.3); color: var(--champagne);
    padding: 12px 20px; border-radius: 8px; font-size: 13px;
    opacity: 0; pointer-events: none; transition: opacity 0.3s ease, transform 0.3s ease;
    z-index: 50;
  }
  .app-status.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 640px) {
    .login-card { padding: 32px 24px; }
    .app-header { align-items: flex-start; }
    .lead-row { padding: 12px 16px; gap: 12px; }
    .lead-row-meta { gap: 10px; }
    .lead-row-meta .cell-muted { display: none; }
    .lead-modal { padding: 0; align-items: flex-end; }
    .lead-modal-card { max-width: none; max-height: 90vh; border-radius: 16px 16px 0 0; padding: 26px 20px; }
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-wrap" id="loginWrap">
  <div class="login-panel">
    <div class="app-brand" style="margin-bottom: 28px;">
      <img src="/assets/logos/logo-icono-blanco.png" alt="Glow21">
      <span>CRM</span>
    </div>
    <div class="login-card">
      <h1>Inicia sesión</h1>
      <p class="intro">Acceso solo para el equipo de Glow21.</p>
      <form id="loginForm">
        <div class="field">
          <label for="loginEmail">Correo</label>
          <input type="text" id="loginEmail" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="loginPassword">Contraseña</label>
          <input type="password" id="loginPassword" autocomplete="current-password" required>
        </div>
        <p class="login-error" id="loginError" hidden></p>
        <button type="submit" class="btn btn-save" id="loginSubmit">Entrar</button>
      </form>
    </div>
  </div>
</div>

<!-- APP -->
<div class="app" id="app" hidden>
  <div class="app-header">
    <div class="app-brand">
      <img src="/assets/logos/logo-icono-blanco.png" alt="Glow21">
      <span>CRM</span>
    </div>
    <div class="app-header-actions">
      <button class="btn btn-outline" id="exportBtn">
        <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13M7 11l5 5 5-5M4 20h16"/></svg></span>
        Exportar CSV
      </button>
      <a href="/admin" class="btn btn-outline">
        <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg></span>
        Panel
      </a>
      <button type="button" class="btn btn-link" onclick="cerrarSesion()">Cerrar sesión</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" id="tabInteresados" onclick="cambiarTab('interesados')">
      Interesados <span class="count" id="countInteresados">0</span>
    </button>
    <button class="tab" id="tabPremium" onclick="cambiarTab('premium')">
      Premium / Pago <span class="count" id="countPremium">0</span>
    </button>
  </div>

  <div class="toolbar">
    <div class="search-wrap">
      <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg></span>
      <input type="search" id="searchInput" placeholder="Buscar por nombre o correo...">
    </div>
  </div>

  <div class="panel-table">
    <div class="lead-list" id="listInteresados"></div>
    <div class="lead-list" id="listPremium" hidden></div>
    <div class="empty-state" id="emptyState" hidden>
      <strong>Nada por aquí todavía</strong>
      <span id="emptyStateText">Cuando alguien se registre, va a aparecer en esta lista.</span>
    </div>
  </div>
</div>

<div class="lead-modal" id="leadModal" hidden>
  <div class="lead-modal-backdrop" id="leadModalBackdrop"></div>
  <div class="lead-modal-card" role="dialog" aria-modal="true">
    <button type="button" class="lead-modal-close" id="leadModalClose" aria-label="Cerrar" title="Cerrar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="lead-modal-head">
      <span class="lead-avatar lead-avatar-lg" id="leadModalAvatar"></span>
      <div>
        <h2 id="leadModalNombre"></h2>
        <span class="cell-muted" id="leadModalFecha"></span>
      </div>
    </div>
    <div class="lead-modal-fields" id="leadModalFields"></div>
    <div class="lead-modal-footer">
      <div class="lead-modal-row">
        <label>Contactado</label>
        <div id="leadModalToggleWrap"></div>
      </div>
      <div class="lead-modal-row lead-modal-row-nota">
        <label for="leadModalNota">Nota</label>
        <textarea id="leadModalNota" rows="3" placeholder="Agregar nota..."></textarea>
      </div>
    </div>
  </div>
</div>

<div class="app-status" id="appStatus"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // Publishable key: segura para exponer en el navegador. Estas tablas solo
  // se pueden leer/actualizar con una sesión autenticada (ver políticas RLS
  // en supabase-setup-7-crm-stripe.sql) — sin login, esto no muestra nada.
  const SUPABASE_URL = 'https://yosammtxqqcwgvkaczyd.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_nfll20Vql75gY-trX9LU0g_pnxgK664';

  const sb = window.supabase
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
    : null;

  // ---------- LOGIN ----------
  const loginWrap = document.getElementById('loginWrap');
  const appEl = document.getElementById('app');
  const loginForm = document.getElementById('loginForm');
  const loginError = document.getElementById('loginError');
  const loginSubmit = document.getElementById('loginSubmit');

  function mostrarLogin() {
    loginWrap.hidden = false;
    appEl.hidden = true;
  }

  async function mostrarApp() {
    loginWrap.hidden = true;
    appEl.hidden = false;
    await cargarTodo();
  }

  async function cerrarSesion() {
    if (sb) await sb.auth.signOut();
    mostrarLogin();
  }

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    loginError.hidden = true;

    if (!sb) {
      loginError.textContent = 'No hay conexión con Supabase en este momento.';
      loginError.hidden = false;
      return;
    }

    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;

    loginSubmit.disabled = true;
    loginSubmit.textContent = 'Entrando...';

    const { error } = await sb.auth.signInWithPassword({ email, password });

    loginSubmit.disabled = false;
    loginSubmit.textContent = 'Entrar';

    if (error) {
      loginError.textContent = 'Correo o contraseña incorrectos.';
      loginError.hidden = false;
      return;
    }

    await mostrarApp();
  });

  // ---------- DATA ----------
  let interesados = [];
  let premium = [];
  let tabActiva = 'interesados';

  function mostrarStatus(msg) {
    const el = document.getElementById('appStatus');
    el.textContent = msg;
    el.classList.add('show');
    setTimeout(() => el.classList.remove('show'), 2200);
  }

  function formatearFecha(iso) {
    if (!iso) return '';
    return new Intl.DateTimeFormat('es-MX', { day: 'numeric', month: 'short', year: 'numeric' }).format(new Date(iso));
  }

  function formatearMonto(centavos, moneda) {
    if (centavos == null) return null;
    try {
      return new Intl.NumberFormat('es-MX', { style: 'currency', currency: (moneda || 'mxn').toUpperCase() }).format(centavos / 100);
    } catch {
      return (centavos / 100).toFixed(2) + ' ' + (moneda || '').toUpperCase();
    }
  }

  async function cargarTodo() {
    if (!sb) return;

    const [resInteresados, resPremium] = await Promise.all([
      sb.from('glow21_profiles').select('*').order('created_at', { ascending: false }),
      sb.from('glow21_premium_leads').select('*').order('created_at', { ascending: false })
    ]);

    if (resInteresados.error || resPremium.error) {
      console.warn('Glow21 CRM: error cargando datos', resInteresados.error, resPremium.error);
      mostrarStatus('No se pudieron cargar los datos. Revisa la consola.');
      return;
    }

    interesados = resInteresados.data || [];
    premium = resPremium.data || [];

    document.getElementById('countInteresados').textContent = interesados.length;
    document.getElementById('countPremium').textContent = premium.length;

    renderTablas();
  }

  function cambiarTab(tab) {
    tabActiva = tab;
    document.getElementById('tabInteresados').classList.toggle('active', tab === 'interesados');
    document.getElementById('tabPremium').classList.toggle('active', tab === 'premium');
    document.getElementById('searchInput').value = '';
    renderTablas();
  }

  function coincide(row, q) {
    if (!q) return true;
    q = q.toLowerCase();
    return (row.nombre || '').toLowerCase().includes(q) || (row.correo || '').toLowerCase().includes(q);
  }

  function crearToggle(activo, onToggle) {
    const btn = document.createElement('div');
    btn.className = 'toggle-mini' + (activo ? ' active' : '');
    btn.setAttribute('role', 'switch');
    btn.setAttribute('aria-checked', String(activo));
    btn.tabIndex = 0;
    btn.innerHTML = '<div class="toggle-mini-thumb"></div>';
    const toggle = () => {
      const next = !btn.classList.contains('active');
      btn.classList.toggle('active', next);
      btn.setAttribute('aria-checked', String(next));
      onToggle(next);
    };
    btn.addEventListener('click', toggle);
    btn.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } });
    return btn;
  }

  function inicial(nombre) {
    return ((nombre || '?').trim().charAt(0) || '?').toUpperCase();
  }

  async function copiarTexto(texto, mensaje) {
    try {
      await navigator.clipboard.writeText(texto);
      mostrarStatus(mensaje || 'Copiado.');
    } catch {
      mostrarStatus('No se pudo copiar. Selecciónalo manualmente.');
    }
  }

  function crearBotonCopiar(texto, mensaje) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'icon-btn';
    btn.title = 'Copiar';
    btn.setAttribute('aria-label', 'Copiar ' + mensaje);
    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M4 16V5a1 1 0 0 1 1-1h11"/></svg>';
    btn.addEventListener('click', () => copiarTexto(texto, mensaje));
    return btn;
  }

  function telefonoWhatsappUrl(telefono) {
    const digitos = (telefono || '').replace(/\D/g, '');
    if (!digitos) return null;
    return 'https://wa.me/' + (digitos.length === 10 ? '52' + digitos : digitos);
  }

  function crearBotonWhatsapp(telefono) {
    const url = telefonoWhatsappUrl(telefono);
    if (!url) return null;
    const a = document.createElement('a');
    a.className = 'icon-btn whatsapp';
    a.href = url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.title = 'Abrir WhatsApp';
    a.setAttribute('aria-label', 'Abrir WhatsApp');
    a.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2 22l5.29-1.39a9.9 9.9 0 0 0 4.75 1.21h.01c5.46 0 9.9-4.45 9.9-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2m0 1.8a8.1 8.1 0 0 1 5.76 2.39 8.07 8.07 0 0 1 2.38 5.72c0 4.48-3.65 8.12-8.15 8.12a8.16 8.16 0 0 1-4.14-1.13l-.3-.17-3.14.82.84-3.06-.19-.32a8.07 8.07 0 0 1-1.25-4.32c0-4.48 3.65-8.12 8.15-8.12M8.5 6.9c-.17 0-.45.06-.68.32-.23.26-.89.87-.89 2.12 0 1.25.91 2.46 1.04 2.63.13.17 1.78 2.87 4.42 3.91 2.19.86 2.63.69 3.11.65.48-.04 1.55-.63 1.77-1.24.22-.61.22-1.13.15-1.24-.06-.11-.24-.17-.5-.3-.26-.13-1.55-.77-1.79-.85-.24-.09-.41-.13-.59.13-.17.26-.67.85-.82 1.02-.15.17-.3.19-.56.06-.26-.13-1.09-.4-2.08-1.28-.77-.68-1.29-1.53-1.44-1.79-.15-.26-.02-.4.11-.53.12-.12.26-.3.39-.45.13-.15.17-.26.26-.43.09-.17.04-.32-.02-.45-.06-.13-.59-1.46-.82-1.99-.21-.5-.43-.44-.59-.45z"/></svg>';
    return a;
  }

  function crearCampoDetalle(campo) {
    const fila = document.createElement('div');
    fila.className = 'lead-field';

    const label = document.createElement('span');
    label.className = 'lead-field-label';
    label.textContent = campo.label;

    const right = document.createElement('div');
    right.className = 'lead-field-right';

    if (campo.badge) {
      const badge = document.createElement('span');
      badge.className = 'badge ' + (campo.badge === 'paid' ? 'badge-paid' : 'badge-pending');
      badge.textContent = campo.valor;
      right.appendChild(badge);
    } else {
      const valor = document.createElement('span');
      valor.className = 'lead-field-value' + (campo.mono ? ' is-mono' : '');
      valor.textContent = campo.valor || '—';
      right.appendChild(valor);
    }

    if (campo.copiable && campo.valor) right.appendChild(crearBotonCopiar(campo.valor, campo.label + ' copiado.'));
    if (campo.whatsapp && campo.valor) {
      const wa = crearBotonWhatsapp(campo.valor);
      if (wa) right.appendChild(wa);
    }

    fila.append(label, right);
    return fila;
  }

  let detalleActual = null;

  function abrirDetalle(tablaKey, row) {
    detalleActual = { tabla: tablaKey, row };

    document.getElementById('leadModalAvatar').textContent = inicial(row.nombre);
    document.getElementById('leadModalNombre').textContent = row.nombre;
    document.getElementById('leadModalFecha').textContent = 'Registrado ' + formatearFecha(row.created_at);

    const campos = [
      { label: 'Correo', valor: row.correo, copiable: true },
      { label: 'Teléfono', valor: row.telefono, copiable: true, whatsapp: true }
    ];

    if (tablaKey === 'glow21_premium_leads') {
      campos.push({ label: 'Dirección', valor: row.direccion, copiable: true });
      campos.push({ label: 'Pago', valor: row.pagado ? 'Pagado' : 'Pendiente', badge: row.pagado ? 'paid' : 'pending' });
      const montoDetalle = formatearMonto(row.monto_centavos, row.moneda);
      if (row.pagado && montoDetalle) {
        campos.push({ label: 'Monto pagado', valor: montoDetalle });
      }
      if (row.stripe_session_id) {
        campos.push({ label: 'ID de pago', valor: row.stripe_session_id, copiable: true, mono: true });
      }
    } else {
      const correosPagados = new Set(
        premium.filter((p) => p.pagado).map((p) => (p.correo || '').trim().toLowerCase())
      );
      const yaPago = correosPagados.has((row.correo || '').trim().toLowerCase());
      campos.push({ label: 'Pagó premium', valor: yaPago ? 'Sí' : 'No', badge: yaPago ? 'paid' : 'pending' });
    }

    const fieldsEl = document.getElementById('leadModalFields');
    fieldsEl.innerHTML = '';
    campos.forEach((c) => fieldsEl.appendChild(crearCampoDetalle(c)));

    const toggleWrap = document.getElementById('leadModalToggleWrap');
    toggleWrap.innerHTML = '';
    toggleWrap.appendChild(crearToggle(!!row.contactado, async (next) => {
      const ok = await actualizarLead(tablaKey, row.id, { contactado: next });
      if (ok) { row.contactado = next; renderTablas(); }
    }));

    const notaEl = document.getElementById('leadModalNota');
    notaEl.value = row.nota || '';
    let ultimaNota = row.nota || '';
    notaEl.onblur = async () => {
      if (notaEl.value !== ultimaNota) {
        const ok = await actualizarLead(tablaKey, row.id, { nota: notaEl.value });
        if (ok) { ultimaNota = notaEl.value; row.nota = notaEl.value; }
      }
    };

    document.getElementById('leadModal').hidden = false;
    document.body.style.overflow = 'hidden';
  }

  function cerrarDetalle() {
    document.getElementById('leadModal').hidden = true;
    document.body.style.overflow = '';
    detalleActual = null;
  }

  document.getElementById('leadModalClose').addEventListener('click', cerrarDetalle);
  document.getElementById('leadModalBackdrop').addEventListener('click', cerrarDetalle);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !document.getElementById('leadModal').hidden) cerrarDetalle();
  });

  function crearFilaLead(tablaKey, row, indicador) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'lead-row';

    const main = document.createElement('div');
    main.className = 'lead-row-main';
    const avatar = document.createElement('span');
    avatar.className = 'lead-avatar';
    avatar.textContent = inicial(row.nombre);
    const text = document.createElement('div');
    text.className = 'lead-row-text';
    const nombreEl = document.createElement('span'); nombreEl.className = 'lead-name'; nombreEl.textContent = row.nombre;
    const correoEl = document.createElement('span'); correoEl.className = 'lead-email'; correoEl.textContent = row.correo;
    text.append(nombreEl, correoEl);
    main.append(avatar, text);

    const meta = document.createElement('div');
    meta.className = 'lead-row-meta';
    meta.appendChild(indicador);
    const contactadoDot = document.createElement('span');
    contactadoDot.className = 'contactado-dot' + (row.contactado ? ' is-on' : '');
    contactadoDot.title = row.contactado ? 'Contactado' : 'Sin contactar';
    meta.appendChild(contactadoDot);
    const fecha = document.createElement('span'); fecha.className = 'cell-muted'; fecha.textContent = formatearFecha(row.created_at);
    meta.appendChild(fecha);
    const chevron = document.createElement('span');
    chevron.className = 'lead-row-chevron';
    chevron.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>';
    meta.appendChild(chevron);

    btn.append(main, meta);
    btn.addEventListener('click', () => abrirDetalle(tablaKey, row));
    return btn;
  }

  async function actualizarLead(tabla, id, cambios) {
    const { error } = await sb.from(tabla).update(cambios).eq('id', id);
    if (error) {
      console.warn('Glow21 CRM: error actualizando', tabla, error);
      mostrarStatus('No se pudo guardar el cambio.');
      return false;
    }
    mostrarStatus('Guardado.');
    return true;
  }

  function renderTablas() {
    const q = document.getElementById('searchInput').value.trim();
    const emptyEl = document.getElementById('emptyState');

    if (tabActiva === 'interesados') {
      const filas = interesados.filter((r) => coincide(r, q));
      const list = document.getElementById('listInteresados');
      list.innerHTML = '';

      const correosPagados = new Set(
        premium.filter((p) => p.pagado).map((p) => (p.correo || '').trim().toLowerCase())
      );

      filas.forEach((row) => {
        const yaPago = correosPagados.has((row.correo || '').trim().toLowerCase());
        const pagoDot = document.createElement('span');
        pagoDot.className = 'pago-dot' + (yaPago ? ' is-paid' : '');
        pagoDot.textContent = yaPago ? 'Pagó' : '—';
        list.appendChild(crearFilaLead('glow21_profiles', row, pagoDot));
      });

      document.getElementById('listInteresados').hidden = false;
      document.getElementById('listPremium').hidden = true;
      emptyEl.hidden = filas.length > 0;
      document.getElementById('emptyStateText').textContent = interesados.length === 0
        ? 'Cuando alguien se registre para ver la masterclass, va a aparecer aquí.'
        : 'Nadie coincide con esa búsqueda.';
    } else {
      const filas = premium.filter((r) => coincide(r, q));
      const list = document.getElementById('listPremium');
      list.innerHTML = '';

      filas.forEach((row) => {
        const wrap = document.createElement('span');
        wrap.className = 'pago-meta';
        const badge = document.createElement('span');
        badge.className = 'badge ' + (row.pagado ? 'badge-paid' : 'badge-pending');
        badge.textContent = row.pagado ? 'Pagado' : 'Pendiente';
        wrap.appendChild(badge);
        const monto = formatearMonto(row.monto_centavos, row.moneda);
        if (row.pagado && monto) {
          const montoEl = document.createElement('span');
          montoEl.className = 'cell-muted';
          montoEl.textContent = monto;
          wrap.appendChild(montoEl);
        }
        list.appendChild(crearFilaLead('glow21_premium_leads', row, wrap));
      });

      document.getElementById('listInteresados').hidden = true;
      document.getElementById('listPremium').hidden = false;
      emptyEl.hidden = filas.length > 0;
      document.getElementById('emptyStateText').textContent = premium.length === 0
        ? 'Cuando alguien dé clic en Acceso Premium, va a aparecer aquí.'
        : 'Nadie coincide con esa búsqueda.';
    }
  }

  document.getElementById('searchInput').addEventListener('input', renderTablas);

  function csvEscape(valor) {
    const texto = String(valor == null ? '' : valor);
    if (/[",\n]/.test(texto)) return '"' + texto.replace(/"/g, '""') + '"';
    return texto;
  }

  document.getElementById('exportBtn').addEventListener('click', () => {
    const q = document.getElementById('searchInput').value.trim();
    let filas, encabezados, datos;

    if (tabActiva === 'interesados') {
      filas = interesados.filter((r) => coincide(r, q));
      const correosPagados = new Set(
        premium.filter((p) => p.pagado).map((p) => (p.correo || '').trim().toLowerCase())
      );
      encabezados = ['Nombre', 'Correo', 'Teléfono', 'Pagó', 'Registrado', 'Contactado', 'Nota'];
      datos = filas.map((r) => [
        r.nombre, r.correo, r.telefono,
        correosPagados.has((r.correo || '').trim().toLowerCase()) ? 'Sí' : 'No',
        formatearFecha(r.created_at), r.contactado ? 'Sí' : 'No', r.nota || ''
      ]);
    } else {
      filas = premium.filter((r) => coincide(r, q));
      encabezados = ['Nombre', 'Correo', 'Teléfono', 'Dirección', 'Pagado', 'Monto', 'ID de pago', 'Registrado', 'Contactado', 'Nota'];
      datos = filas.map((r) => [
        r.nombre, r.correo, r.telefono, r.direccion, r.pagado ? 'Sí' : 'No',
        formatearMonto(r.monto_centavos, r.moneda) || '',
        r.stripe_session_id || '', formatearFecha(r.created_at), r.contactado ? 'Sí' : 'No', r.nota || ''
      ]);
    }

    const csv = [encabezados, ...datos].map((fila) => fila.map(csvEscape).join(',')).join('\r\n');
    const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `glow21-${tabActiva}-${new Date().toISOString().slice(0, 10)}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  // ---------- INIT ----------
  (async function initAuth() {
    if (!sb) { mostrarLogin(); return; }
    const { data: { session } } = await sb.auth.getSession();
    if (session) await mostrarApp();
    else mostrarLogin();
  })();
</script>

</body>
