<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glow21 Admin</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --color-pearl: #FDFBF7;
      --color-slate: #2C3539;
      --color-gold: #E5C4A3;
      --color-rose: #F4DCD6;
    }

    html, body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--color-slate);
      color: white;
      padding: 40px 20px;
      -webkit-font-smoothing: antialiased;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #1a1d1f;
      padding: 50px;
      border-radius: 8px;
      border: 1px solid var(--color-gold);
    }

    h1 {
      font-size: 32px;
      margin-bottom: 40px;
      color: var(--color-gold);
      font-weight: 300;
      letter-spacing: 1px;
    }

    .form-group {
      margin-bottom: 30px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 10px;
      color: var(--color-gold);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--color-gold);
      border-radius: 6px;
      background: var(--color-slate);
      color: white;
      font-size: 15px;
      font-family: 'Courier New', monospace;
      transition: all 0.3s ease;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--color-rose);
      box-shadow: 0 0 0 2px rgba(244, 220, 214, 0.2);
    }

    input[type="text"]::placeholder {
      color: #666;
    }

    .toggle-group {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .toggle {
      width: 56px;
      height: 32px;
      background: #333;
      border-radius: 16px;
      cursor: pointer;
      position: relative;
      transition: all 0.3s ease;
      border: 1px solid var(--color-gold);
      flex-shrink: 0;
    }

    .toggle.active {
      background: var(--color-gold);
    }

    .toggle-thumb {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 26px;
      height: 26px;
      background: white;
      border-radius: 13px;
      transition: all 0.3s ease;
    }

    .toggle.active .toggle-thumb {
      left: 27px;
    }

    .toggle-label {
      font-size: 14px;
      color: white;
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 10px;
    }

    .btn-save {
      background: linear-gradient(135deg, var(--color-rose) 0%, var(--color-gold) 100%);
      color: var(--color-slate);
    }

    .btn-save:hover {
      opacity: 0.9;
    }

    .btn-back {
      background: transparent;
      color: var(--color-gold);
      border: 1px solid var(--color-gold);
    }

    .btn-back:hover {
      background: var(--color-gold);
      color: var(--color-slate);
    }

    .status {
      padding: 15px;
      border-radius: 6px;
      text-align: center;
      margin-top: 20px;
      display: none;
      font-size: 14px;
    }

    .status.success {
      background: #1b5631;
      color: #b9e5ba;
    }

    .status.error {
      background: #5a2f2f;
      color: #ffb9b9;
    }

    .info {
      background: #2a2a2a;
      padding: 15px;
      border-radius: 6px;
      font-size: 12px;
      color: #aaa;
      margin-top: 15px;
      line-height: 1.6;
      border-left: 3px solid var(--color-gold);
    }

    .info code {
      background: var(--color-slate);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'Courier New', monospace;
      color: var(--color-gold);
    }

    @media (max-width: 480px) {
      .container {
        padding: 30px;
      }

      h1 {
        font-size: 24px;
      }

      .toggle-group {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>

<div class="container">
  
  <h1>⚙️ Panel de Control</h1>

  <!-- ZOOM ID -->
  <div class="form-group">
    <label for="zoomId">Zoom Meeting ID</label>
    <input 
      type="text" 
      id="zoomId" 
      placeholder="Ej: 123456789"
    >
    <div class="info">
      Obtén el ID de tu reunión de Zoom. Ejemplo: <code>https://zoom.us/wc/join/123456789</code> → el ID es <code>123456789</code>
    </div>
  </div>

  <!-- BOTÓN COMPRA -->
  <div class="form-group">
    <label>Activar botón "Acceso Premium"</label>
    <div class="toggle-group">
      <div class="toggle" id="toggleCompra">
        <div class="toggle-thumb"></div>
      </div>
      <span class="toggle-label" id="estadoCompra">Desactivado</span>
    </div>
    <div class="info">
      Cuando actives esto, el botón de compra aparecerá en el modal al final de la masterclass.
    </div>
  </div>

  <!-- BOTONES -->
  <button class="btn btn-save" onclick="guardar()">💾 Guardar configuración</button>
  <button class="btn btn-back" onclick="irAlanding()">← Volver a landing</button>

  <div id="status" class="status"></div>

</div>

<script>
  // CARGAR CONFIG
  function cargarConfig() {
    const zoomId = localStorage.getItem('glow21_zoom_id') || '';
    const botonActivo = localStorage.getItem('glow21_boton_compra') === 'true';

    document.getElementById('zoomId').value = zoomId;
    
    if (botonActivo) {
      document.getElementById('toggleCompra').classList.add('active');
      document.getElementById('estadoCompra').textContent = 'Activado';
    }
  }

  // TOGGLE
  document.getElementById('toggleCompra').addEventListener('click', function() {
    this.classList.toggle('active');
    const estado = this.classList.contains('active') ? 'Activado' : 'Desactivado';
    document.getElementById('estadoCompra').textContent = estado;
  });

  // GUARDAR
  function guardar() {
    const zoomId = document.getElementById('zoomId').value.trim();
    const botonActivo = document.getElementById('toggleCompra').classList.contains('active');

    if (!zoomId) {
      mostrarStatus('Por favor ingresa el Zoom ID', 'error');
      return;
    }

    localStorage.setItem('glow21_zoom_id', zoomId);
    localStorage.setItem('glow21_boton_compra', botonActivo);

    mostrarStatus('✅ Configuración guardada correctamente', 'success');

    setTimeout(() => {
      window.location.href = '/';
    }, 1500);
  }

  function mostrarStatus(msg, tipo) {
    const status = document.getElementById('status');
    status.textContent = msg;
    status.className = `status ${tipo}`;
  }

  function irAlanding() {
    window.location.href = '/';
  }

  // PERMITIR ENTER
  document.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') guardar();
  });

  // INICIAR
  cargarConfig();
</script>

</body>
</html>
